[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veltui"
version = "0.2.0"
description = "duck.ai in your terminal — private AI chat, no account, no API key"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kfrt" }]
dependencies = [
    "textual>=8,<9",
    "rich>=13.7",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.urls]
Homepage = "https://github.com/kfrttlw/veltui"

[project.scripts]
veltui = "veltui.cli:main"

[tool.setuptools]
packages = ["veltui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W"]
